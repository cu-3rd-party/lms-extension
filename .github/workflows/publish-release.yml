name: Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-chrome:
    name: Publish Chrome
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: publish-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          RAW_NAME="${{ github.event.release.name }}"
          RAW_TAG="${{ github.event.release.tag_name }}"
          RAW="${RAW_NAME:-$RAW_TAG}"
          VERSION="${RAW#v}"
          if [[ -z "$VERSION" ]]; then
            echo "Release name/tag is empty" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set package version
        run: |
          node -e "const fs=require('fs'),pkg=JSON.parse(fs.readFileSync('package.json','utf8'));pkg.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Build & pack chrome
        run: bun run release:chrome

      - name: Publish to Chrome Web Store
        uses: browser-actions/release-chrome-extension@v0
        with:
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          extension-path: build/lms-extension-chrome.zip
          oauth-client-id: ${{ secrets.CHROME_CLIENT_ID }}
          oauth-client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          oauth-refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}

  publish-firefox:
    name: Publish Firefox
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: publish-firefox
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          RAW_NAME="${{ github.event.release.name }}"
          RAW_TAG="${{ github.event.release.tag_name }}"
          RAW="${RAW_NAME:-$RAW_TAG}"
          VERSION="${RAW#v}"
          if [[ -z "$VERSION" ]]; then
            echo "Release name/tag is empty" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set package version
        run: |
          node -e "const fs=require('fs'),pkg=JSON.parse(fs.readFileSync('package.json','utf8'));pkg.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Build & pack firefox
        run: bun run release:firefox

      - name: Publish to Firefox Add-ons
        uses: kewisch/action-web-ext@v1
        with:
          cmd: sign
          source: build/lms-extension-firefox.xpi
          channel: listed
          apiKey: ${{ secrets.AMO_API_KEY }}
          apiSecret: ${{ secrets.AMO_API_SECRET }}
          waitForDownload: false

  publish-safari:
    name: Publish Safari
    runs-on: macos-latest
    environment: publish-safari
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build and notarize Safari app
        run: bundle exec fastlane mac release
        env:
          FASTLANE_USER: ${{ secrets.APPLE_ID }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: CU-LMS-Enhancer-Safari
          path: build/release/CU LMS Enhancer.dmg

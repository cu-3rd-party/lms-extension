name: Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (vX.Y.Z): из него берётся версия Chrome/Firefox, к нему прикрепляются файлы'
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish-chrome:
    name: Publish Chrome
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: publish-chrome
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-$INPUT_TAG}"
          RAW="${RELEASE_NAME:-$TAG}"
          VERSION="${RAW#v}"
          if [[ -z "$VERSION" ]]; then
            echo "Release name/tag is empty: при ручном запуске укажи tag" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}

      - name: Set package version
        run: |
          bun -e "const fs=require('fs'),pkg=JSON.parse(fs.readFileSync('package.json','utf8'));pkg.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Build & pack chrome
        run: bun run release:chrome

      - name: Attach ZIP to GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" build/lms-extension-chrome.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}

      - name: Publish to Chrome Web Store
        uses: browser-actions/release-chrome-extension@v0
        with:
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          extension-path: build/lms-extension-chrome.zip
          oauth-client-id: ${{ secrets.CHROME_CLIENT_ID }}
          oauth-client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          oauth-refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}

  publish-firefox:
    name: Publish Firefox
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: publish-firefox
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-$INPUT_TAG}"
          RAW="${RELEASE_NAME:-$TAG}"
          VERSION="${RAW#v}"
          if [[ -z "$VERSION" ]]; then
            echo "Release name/tag is empty: при ручном запуске укажи tag" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}

      - name: Set package version
        run: |
          bun -e "const fs=require('fs'),pkg=JSON.parse(fs.readFileSync('package.json','utf8'));pkg.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Build & pack firefox
        run: bun run release:firefox

      - name: Attach unsigned XPI to GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" build/lms-extension-firefox.xpi --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}

      # Ревью AMO идёт дольше, чем живёт раннер: ждём только валидацию,
      # одобрение и подписанный XPI — уже в кабинете AMO.
      - name: Submit to Firefox Add-ons
        run: bunx web-ext sign --source-dir dist/firefox --channel listed --approval-timeout 0
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}

  publish-safari:
    name: Publish Safari
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release')
    runs-on: macos-latest
    environment: publish-safari
    permissions:
      contents: write
    concurrency:
      group: publish-safari-${{ github.event.release.tag_name || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Install node-gyp for native modules
        run: bun add --global node-gyp

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Check Safari release tooling
        run: bundle exec ruby fastlane/tests/safari_release_test.rb

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build and notarize Safari app
        run: bundle exec fastlane mac release
        env:
          FASTLANE_USER: ${{ secrets.APPLE_ID }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          SAFARI_RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Generate signed appcast
        if: github.event_name == 'release'
        run: bundle exec fastlane mac appcast
        env:
          SAFARI_RELEASE_TAG: ${{ github.event.release.tag_name }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

      - name: Publish DMG and appcast to GitHub Release
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" build/release/lms-extension-safari.dmg --clobber
          gh release upload "$RELEASE_TAG" build/release/appcast.xml --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: lms-extension-safari.dmg
          path: build/release/lms-extension-safari.dmg
          if-no-files-found: error

      - name: Upload appcast artifact
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: safari-appcast
          path: build/release/appcast.xml
          if-no-files-found: error

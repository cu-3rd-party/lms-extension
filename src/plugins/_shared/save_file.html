<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Сохранение файла</title>
    <style>
      :root {
        --bg: #f1f2f4;
        --panel: #ffffff;
        --text: #1f2226;
        --muted: #6b7079;
        --border: #d8dbe0;
        --accent: #2f6fed;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1d20;
          --panel: #26272b;
          --text: #e8eaed;
          --muted: #9aa0a6;
          --border: #3a3b40;
          --accent: #6b9bff;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.5 -apple-system,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
      main {
        width: min(440px, calc(100% - 32px));
        padding: 28px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
      }
      #name {
        color: var(--text);
        font-weight: 600;
        word-break: break-all;
      }
      button {
        padding: 10px 22px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Готовлю файл…</h1>
      <p id="note"></p>
      <button id="save" type="button" hidden>Сохранить</button>
    </main>
    <script src="save_file.js"></script>
  </body>
</html>

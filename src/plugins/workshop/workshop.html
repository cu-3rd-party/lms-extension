<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3rd-theme workshop</title>
    <link rel="stylesheet" href="workshop.css" />
  </head>
  <body>
    <div id="tryon-bar" class="tryon-bar" hidden></div>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <strong>3rd-theme workshop</strong>
        </div>
        <div id="current-theme" class="current-theme"></div>
        <nav id="rooms" class="rooms"></nav>
        <div class="sidebar-actions">
          <button id="join-room-btn" class="btn">Войти по коду</button>
          <button id="create-room-btn" class="btn">Создать комнату</button>
        </div>
        <div class="sidebar-bottom">
          <button id="mine-btn" class="btn ghost wide">Мои темы</button>
          <button id="default-theme-btn" class="btn ghost wide">Поставить тему по умолчанию</button>
          <button id="publish-btn" class="btn primary wide">Опубликовать тему</button>
          <button id="nickname-btn" class="nickname" title="Сменить ник"></button>
        </div>
      </aside>
      <main id="main" class="main">
        <p class="muted center">Загружаю 3rd-theme workshop…</p>
      </main>
    </div>
    <div id="modal-root"></div>
    <div id="toast" class="toast" hidden></div>

    <script src="../_shared/settings_registry.js"></script>
    <script src="workshop_api.js"></script>
    <script src="workshop.js"></script>
  </body>
</html>
